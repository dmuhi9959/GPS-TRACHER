<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker Pekerja Lapangan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; }
        
        #reset-btn {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            padding: 10px 15px; background: #28a745; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold; display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #reset-btn:hover { background: #218838; }

        #info-box {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 15px;
            border-radius: 8px; font-family: Arial, sans-serif; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #team-name { color: #ffc107; font-weight: bold; }
        #status-text { color: #4CAF50; font-weight: bold; }

        #sound-btn {
            position: absolute; top: 60px; right: 10px; z-index: 1000;
            padding: 10px 15px; background: #ffc107; color: black; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #sound-btn:hover { background: #e0a800; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .sos-alert { animation: blink 1s infinite; }
    </style>
</head>
<body>
    <div id="info-box">
        🏢 Tim: <span id="team-name">FT CIKAMPEK</span><br>
        📍 Status: <span id="status-text">AMAN</span>
    </div>

    <button id="reset-btn" onclick="resetSOS()">Reset SOS (Aman)</button>
    <button id="sound-btn" onclick="aktifkanSuara()">🔊 Aktifkan Suara</button>
    <div id="map"></div>

    <script>
        // 1. SETTING FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyC4CQMl5l1n1voweOgQouMD1kJcpHs-esU",
            databaseURL: "https://gps-tracher-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. SETTING PETA
        const map = L.map('map').setView([-6.396311, 107.430083], 18);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri Satellite',
            maxZoom: 19
        }).addTo(map);

        // 3. SETTING IKON (GUNAKAN NAMA FILE YANG KAMU UPLOAD KE GITHUB)
        // UBAH 'pekerja.png' DI BAWAH SESUAI NAMA FILE KAMU!
        const iconAman = L.icon({
            iconUrl: 'pekerja.png',  // <--- UBAH NAMA INI (Contoh: pekerja.png atau pekerja.jpg)
            iconSize: [50, 50], 
            iconAnchor: [25, 50], 
            popupAnchor: [0, -50]
        });
        
        const iconSOS = L.icon({
            iconUrl: 'https://img.icons8.com/3d-fluency/96/siren.png', 
            iconSize: [48, 48], 
            iconAnchor: [24, 48], 
            popupAnchor: [0, -48]
        });

        const marker = L.marker([-6.396311, 107.430083], {icon: iconAman}).addTo(map);

        // 4. JEJAK HISTORY
        const historyPoints = [];
        const historyLine = L.polyline(historyPoints, { color: '#00ffff', weight: 4, opacity: 0.7 }).addTo(map);

        // 5. SISTEM ALARM SUARA
        let audioCtx = null;
        let alarmInterval = null;
        let isSoundActive = false;

        function aktifkanSuara() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            isSoundActive = true;
            document.getElementById('sound-btn').style.display = 'none';
            alert("Suara diaktifkan! Sistem akan berbunyi jika ada SOS.");
        }

        function bunyikanSirine() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.5);
            
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 1);
        }

        function startAlarm() {
            if (isSoundActive && !alarmInterval) {
                bunyikanSirine();
                alarmInterval = setInterval(bunyikanSirine, 1000);
            }
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // 6. BACA DATA REAL-TIME
        let currentLat = 0, currentLng = 0, currentStatus = "AMAN";

        database.ref('gps/aku/lat').on('value', (s) => { currentLat = s.val(); updateMap(); });
        database.ref('gps/aku/lng').on('value', (s) => { currentLng = s.val(); updateMap(); });
        
        database.ref('gps/aku/status').on('value', (s) => {
            let newStatus = s.val() || "AMAN";
            if (newStatus === "SOS" && currentStatus !== "SOS") {
                startAlarm();
            } else if (newStatus === "AMAN") {
                stopAlarm();
            }
            currentStatus = newStatus;
            updateMap();
        });

        function updateMap() {
            if (currentLat && currentLng) {
                const newPos = [currentLat, currentLng];
                marker.setLatLng(newPos);
                map.setView(newPos, 18); 

                if (historyPoints.length === 0 || map.distance(newPos, historyPoints[historyPoints.length - 1]) > 10) {
                    historyPoints.push(newPos);
                    historyLine.setLatLngs(historyPoints);
                }

                if (currentStatus === "SOS") {
                    marker.setIcon(iconSOS);
                    marker.bindPopup("<b class='sos-alert' style='color:red; font-size: 18px;'>🚨 SOS! BUTUH BANTUAN! 🚨</b><br>Tim: FT CIKAMPEK<br>Lat: " + currentLat + "<br>Lng: " + currentLng).openPopup();
                    document.getElementById('reset-btn').style.display = 'block';
                    document.getElementById('status-text').innerText = "SOS!";
                    document.getElementById('status-text').style.color = "red";
                } else {
                    marker.setIcon(iconAman);
                    marker.bindPopup("✅ Status: Aman<br>Tim: FT CIKAMPEK<br>Lat: " + currentLat + "<br>Lng: " + currentLng).openPopup();
                    document.getElementById('reset-btn').style.display = 'none';
                    document.getElementById('status-text').innerText = "AMAN";
                    document.getElementById('status-text').style.color = "#4CAF50";
                }
            }
        }

        function resetSOS() {
            stopAlarm();
            database.ref('gps/aku/status').set("AMAN");
        }
    </script>
</body>
</html>
