<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker Pekerja Lapangan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; }
        
        /* Tombol Reset SOS */
        #reset-btn {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            padding: 10px 15px; background: #28a745; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold; display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #reset-btn:hover { background: #218838; }

        /* Info Box (Baterai & Status) */
        #info-box {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 15px;
            border-radius: 8px; font-family: Arial, sans-serif; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #battery-status { color: #4CAF50; font-weight: bold; }
        #status-text { color: #4CAF50; font-weight: bold; }

        /* Animasi Berkedip untuk SOS */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .sos-alert { animation: blink 1s infinite; }

        /* Styling untuk Emoji Icon */
        .emoji-icon {
            font-size: 40px; /* Ukuran emoji */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Bayangan agar kelihatan di peta gelap */
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="info-box">
        🔋 Baterai: <span id="battery-status">100%</span><br>
        📍 Status: <span id="status-text">AMAN</span>
    </div>

    <button id="reset-btn" onclick="resetSOS()">Reset SOS (Aman)</button>
    <div id="map"></div>

    <script>
        // 1. SETTING FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyC4CQMl5l1n1voweOgQouMD1kJcpHs-esU",
            databaseURL: "https://gps-tracher-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. SETTING PETA (SATELIT ASLI)
        const map = L.map('map').setView([-6.396311, 107.430083], 18);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri Satellite',
            maxZoom: 19
        }).addTo(map);

        // 3. SETTING IKON PAKAI EMOJI 👷‍♂️
        const iconAman = L.divIcon({
            html: '<div class="emoji-icon">👷‍♂️</div>',
            className: '', 
            iconSize: [40, 40],
            iconAnchor: [20, 35], // Posisi tengah bawah emoji
            popupAnchor: [0, -35]
        });

        const iconSOS = L.divIcon({
            html: '<div class="emoji-icon">🚨</div>', // Emoji Sirine Darurat
            className: '', 
            iconSize: [40, 40],
            iconAnchor: [20, 35],
            popupAnchor: [0, -35]
        });

        const marker = L.marker([-6.396311, 107.430083], {icon: iconAman}).addTo(map);

        // 4. SETTING JEJAK HISTORY (GARIS POLYLINE)
        const historyPoints = [];
        const historyLine = L.polyline(historyPoints, {
            color: '#00ffff',
            weight: 4,
            opacity: 0.7
        }).addTo(map);

        // 5. BACA DATA REAL-TIME
        let currentLat = 0, currentLng = 0, currentStatus = "AMAN", currentBat = 100;

        database.ref('gps/aku/lat').on('value', (s) => { currentLat = s.val(); updateMap(); });
        database.ref('gps/aku/lng').on('value', (s) => { currentLng = s.val(); updateMap(); });
        
        database.ref('gps/aku/status').on('value', (s) => {
            currentStatus = s.val() || "AMAN";
            updateMap();
        });

        database.ref('gps/aku/baterai').on('value', (s) => {
            if (s.exists()) {
                currentBat = s.val();
                document.getElementById('battery-status').innerText = currentBat + "%";
            }
        });

        function updateMap() {
            if (currentLat && currentLng) {
                const newPos = [currentLat, currentLng];
                
                marker.setLatLng(newPos);
                map.setView(newPos, 18); 

                if (historyPoints.length === 0 || map.distance(newPos, historyPoints[historyPoints.length - 1]) > 3) {
                    historyPoints.push(newPos);
                    historyLine.setLatLngs(historyPoints);
                }

                if (currentStatus === "SOS") {
                    marker.setIcon(iconSOS);
                    marker.bindPopup("<b class='sos-alert' style='color:red; font-size: 18px;'>🚨 SOS! BUTUH BANTUAN! 🚨</b><br>Lat: " + currentLat + "<br>Lng: " + currentLng).openPopup();
                    document.getElementById('reset-btn').style.display = 'block';
                    document.getElementById('status-text').innerText = "SOS!";
                    document.getElementById('status-text').style.color = "red";
                } else {
                    marker.setIcon(iconAman);
                    marker.bindPopup("✅ Status: Aman<br>Lat: " + currentLat + "<br>Lng: " + currentLng).openPopup();
                    document.getElementById('reset-btn').style.display = 'none';
                    document.getElementById('status-text').innerText = "AMAN";
                    document.getElementById('status-text').style.color = "#4CAF50";
                }
            }
        }

        function resetSOS() {
            database.ref('gps/aku/status').set("AMAN");
        }
    </script>
</body>
</html>
