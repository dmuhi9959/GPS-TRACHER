<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker Firebase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. SETTING FIREBASE KAMU
        const firebaseConfig = {
            apiKey: "AIzaSyC4CQMl5l1n1voweOgQouMD1kJcpHs-esU",
            databaseURL: "https://gps-tracher-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. INISIALISASI PETA (LEAFLET)
        const map = L.map('map').setView([-6.396311, 107.430083], 15); // Default ke lokasimu yang tadi
        
        // Menggunakan CartoDB Voyager (Bebas Block 403)
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(map);

        // Marker (Pin Merah)
        const marker = L.marker([-6.396311, 107.430083]).addTo(map);
        
        // Lingkaran akurasi GPS
        const circle = L.circle([-6.396311, 107.430083], {
            color: 'blue',
            fillColor: '#30f',
            fillOpacity: 0.2,
            radius: 20
        }).addTo(map);

        // 3. BACA DATA REAL-TIME DARI FIREBASE
        let currentLat = -6.396311;
        let currentLng = 107.430083;

        // Mendengarkan perubahan data Latitude
        database.ref('gps/lat').on('value', (snapshot) => {
            currentLat = snapshot.val();
            updateMap(currentLat, currentLng);
        });

        // Mendengarkan perubahan data Longitude
        database.ref('gps/lng').on('value', (snapshot) => {
            currentLng = snapshot.val();
            updateMap(currentLat, currentLng);
        });

        // Fungsi untuk update posisi pin di peta
        function updateMap(lat, lng) {
            if (lat && lng) {
                marker.setLatLng([lat, lng]);
                circle.setLatLng([lat, lng]);
                map.setView([lat, lng], 17);
                
                // Tampilkan koordinat saat pin di-klik
                marker.bindPopup("Lokasi GPS Saya:<br>Lat: " + lat + "<br>Lng: " + lng).openPopup();
            }
        }
    </script>
</body>
</html>
