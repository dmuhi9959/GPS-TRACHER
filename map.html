<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker SOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100%; }
        
        /* Tombol Reset SOS */
        #reset-btn {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            padding: 10px 15px; background: #28a745; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold; display: none;
        }
        #reset-btn:hover { background: #218838; }

        /* Animasi Berkedip untuk SOS */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .sos-alert {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <button id="reset-btn" onclick="resetSOS()">Reset SOS (Aman)</button>
    <div id="map"></div>

    <script>
        // 1. SETTING FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyC4CQMl5l1n1voweOgQouMD1kJcpHs-esU",
            databaseURL: "https://gps-tracher-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. SETTING PETA
        const map = L.map('map').setView([-6.396311, 107.430083], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CartoDB'
        }).addTo(map);

        // 3. SETTING IKON
        const iconAman = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/4344/4344049.png', // Orang Biru
            iconSize: [40, 40], iconAnchor: [20, 40], popupAnchor: [0, -40]
        });
        const iconSOS = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/921/921238.png', // Orang Merah
            iconSize: [45, 45], iconAnchor: [22, 45], popupAnchor: [0, -45]
        });

        const marker = L.marker([-6.396311, 107.430083], {icon: iconAman}).addTo(map);

        // 4. BACA DATA REAL-TIME
        let currentLat = 0, currentLng = 0, currentStatus = "AMAN";

        database.ref('gps/aku/lat').on('value', (s) => { currentLat = s.val(); updateMap(); });
        database.ref('gps/aku/lng').on('value', (s) => { currentLng = s.val(); updateMap(); });
        
        // Baca Status SOS
        database.ref('gps/aku/status').on('value', (s) => {
            currentStatus = s.val() || "AMAN";
            updateMap();
        });

        function updateMap() {
            if (currentLat && currentLng) {
                marker.setLatLng([currentLat, currentLng]);
                map.setView([currentLat, currentLng], 16);

                if (currentStatus === "SOS") {
                    // Jika SOS
                    marker.setIcon(iconSOS);
                    marker.bindPopup("<b class='sos-alert' style='color:red; font-size: 18px;'>🚨 SOS! BUTUH BANTUAN! 🚨</b><br>Lat: " + currentLat + "<br>Lng: " + currentLng).openPopup();
                    document.getElementById('reset-btn').style.display = 'block'; // Tampilkan tombol reset
                } else {
                    // Jika Aman
                    marker.setIcon(iconAman);
                    marker.bindPopup("✅ Status: Aman<br>Lat: " + currentLat + "<br>Lng: " + currentLng).openPopup();
                    document.getElementById('reset-btn').style.display = 'none'; // Sembunyikan tombol reset
                }
            }
        }

        // Fungsi tombol reset di web
        function resetSOS() {
            database.ref('gps/aku/status').set("AMAN");
        }
    </script>
</body>
</html>
